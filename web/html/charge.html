<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>낙동랜드 충전소</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/charge.css">
</head>

<body>

    <div class="charge-box">

        <p class="logo">🎰 낙동랜드</p>

        <div class="right-menu">

            <button class="main-btn">
                <i class="fa-solid fa-house"></i>
                <a href ="/html/mmain.html">메인으로</a>
            </button>

            <div class="user-box">

                <img src="../public/아이콘.jpg" alt="프로필">

                <div class="user-info">
                    <strong>낙동유저님</strong>
                    <p>보유코인 <span>12,500 코인</span></p>
                </div>

            </div>

        </div>

    </div>

    <div class="charge-banner">
        <img src="../public/충전.png" alt="충전배너">
    </div>

    <div class="charge-container">

        <!-- 왼쪽 충전 카드 -->

        <div class="main-charge">

            <h2>👑 코인 충전 금액 선택</h2>

            <div class="coin-list">

                <div class="check-box" data-coin="5,000 코인" data-price="5,000원">
                    <img src="../public/1.png" alt="5000코인">
                </div>

                <div class="check-box" data-coin="12,000 코인" data-price="10,000원">
                    <img src="../public/2.png" alt="12000코인">
                </div>

                <div class="check-box selected" data-coin="22,000 코인" data-price="20,000원">
                    <img src="../public/3.png" alt="22000코인">
                </div>

                <div class="check-box" data-coin="35,000 코인" data-price="30,000원">
                    <img src="../public/4.png" alt="35000코인">
                </div>

                <div class="check-box" data-coin="60,000 코인" data-price="50,000원">
                    <img src="../public/5.png" alt="60000코인">
                </div>

                <div class="check-box" data-coin="125,000 코인" data-price="100,000원">
                    <img src="../public/6.png" alt="125000코인">
                </div>

            </div>

        </div>
        <div class="charge-right">

            <h2>
                <i class="fa-solid fa-wallet"></i>
                결제 방법 선택
            </h2>

            <div class="selected-info">
                <p>선택 상품</p>
                <strong id="selectedCoin">22,000 코인</strong>
                <span id="selectedPrice">20,000원</span>
            </div>

            <div class="pay-box active">

                <i class="fa-solid fa-credit-card"></i>

                <span>카드 결제</span>

                <div class="check-circle">
                    <i class="fa-solid fa-check"></i>
                </div>

            </div>

            <div class="pay-box">

                <i class="fa-solid fa-mobile-screen"></i>

                <span>간편 결제</span>

                <div class="empty-circle"></div>

            </div>

            <div class="pay-box">

                <i class="fa-solid fa-mobile"></i>

                <span>휴대폰 결제</span>

                <div class="empty-circle"></div>

            </div>

            <div class="pay-box">

                <i class="fa-solid fa-building-columns"></i>

                <span>계좌 이체</span>

                <div class="empty-circle"></div>

            </div>

            <button class="pay-btn">
                <i class="fa-solid fa-shield-halved"></i>
                결제하기
            </button>

        </div>
    </div>
    <script>

        const payBoxes = document.querySelectorAll('.pay-box');

        payBoxes.forEach(box => {

            box.addEventListener('click', () => {

                payBoxes.forEach(item => {

                    item.classList.remove('active');

                    const checked = item.querySelector('.check-circle');

                    if (checked) {
                        checked.classList.remove('check-circle');
                        checked.classList.add('empty-circle');
                        checked.innerHTML = '';
                    }

                });

                box.classList.add('active');

                const empty = box.querySelector('.empty-circle');

                if (empty) {

                    empty.classList.remove('empty-circle');
                    empty.classList.add('check-circle');

                    empty.innerHTML =
                        '<i class="fa-solid fa-check"></i>';

                }

            });

        });


        const coinBoxes = document.querySelectorAll('.check-box');

        const selectedCoin =
            document.getElementById('selectedCoin');

        const selectedPrice =
            document.getElementById('selectedPrice');

        coinBoxes.forEach(box => {

            box.addEventListener('click', () => {

                coinBoxes.forEach(item => {
                    item.classList.remove('selected');
                });

                box.classList.add('selected');

                selectedCoin.textContent =
                    box.dataset.coin;

                selectedPrice.textContent =
                    box.dataset.price;

            });

        });

    </script>
</body>

</html>
