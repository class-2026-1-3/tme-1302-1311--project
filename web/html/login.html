<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>낙동랜드 로그인</title>
    <link href="../css/login.css" rel="stylesheet">
</head>
<body>

    <div class="container">

        <a href="./mmain.html" class="movemain">
            ✕
        </a>

        <div class="logbox">

            <div class="slot-icons">🎰 🎰 🎰</div>

            <h1 class="logo">LOGIN</h1>

            <input type="text" class="log1" placeholder="아이디">

            <input type="password" class="log2" placeholder="비밀번호">

            <label class="keep-login">
                <input type="checkbox">
                로그인 상태 유지
            </label>

            <div class="login">
                <p class="logms"><a href="./mmain.html">로그인</a></p>
                <!-- 글자 색 바꿔야할뜻 바뀐거 같아 -->
            </div>

            <div class="links">
                <span>회원 가입</span>
                <span>아이디 찾기</span>
                <span>비밀번호 재설정</span>
            </div>

            <p class="ml">또는</p>

            <div class="naver">
                <img src="/public/unnamed.png">
                <p style="color:black;">Naver로 로그인</p>
            </div>

            <div class="google">
                <img src="../public/images-4.png">
                <p style="color:black;">Google로 로그인</p>
            </div>

        </div>

    </div>

</body>
</html>
